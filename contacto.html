<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="contacto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Veterinaria La Mary - Contacto</title>
</head>

<body>
    <header>
        <div class="marca">
            <h1>Veterinaria La Mary</h1>
            <p>Consentidos, sanos y felices</p>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Institucional.html">Institucional</a></li>
                <li><a href="Contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>

<form action="#" method="POST">
        <h2>Contacto</h2>
        
        <!-- Motivo de contacto arriba -->
        <div class="form-group">
            <label for="motivo">Motivo de contacto:</label>
            <select id="motivo" name="motivo" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="baño">Baño de mascotas</option>
                <option value="consultas">Consultas</option>
                <option value="exoticos">Animales exóticos</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
        </div>

        <div class="form-group">
            <label for="tipo_mascota">Tipo de mascotas:</label>
            <input type="text" id="tipo_mascota" name="tipo_mascota" placeholder="Ej: Perro, Gato, Reptil..." required>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" required></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>



    </main>

    <footer>
        <p>Veterinaria La Mary - Av. San Martín 1247, Concordia, Entre Rios</p>
        <p> Trabajo Final Integrador - Introducción al Desarrollo Web 2026</p>
    </footer>


</body>

</html>
